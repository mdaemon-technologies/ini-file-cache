# Builds the package and tests it across the Node.js versions it supports.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
#
# The package supports older Node.js than its toolchain does: Vite needs Node 20.19 and
# Vitest needs Node 22.12. So the full suite runs where the toolchain does, and the bundle
# it builds is smoke-tested on the older versions with node:test and the runtime
# dependencies alone — what a consumer installs.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    # Fails on a known vulnerability in anything a consumer installs. Dev-only findings are
    # left to `npm audit`: they never reach a consumer, and some have no fixed release.
    - name: Audit runtime dependencies
      run: npm audit --omit=dev --audit-level=moderate
    - run: npm run build
    # The Vitest suite against the source, then the smoke tests against the bundle.
    - run: npm test
    - name: Keep the bundle for the older Node versions
      if: matrix.node-version == '24.x'
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  smoke:
    needs: build

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    # The bundle built and tested above, replacing the committed one, which may be stale
    # on a pull request.
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    # The bundle imports its runtime dependencies rather than inlining them, so they must be
    # installed. --omit=dev installs exactly what a consumer gets and none of the toolchain,
    # which could not run on these versions anyway.
    - run: npm ci --omit=dev --ignore-scripts
    - run: npm run test:smoke
