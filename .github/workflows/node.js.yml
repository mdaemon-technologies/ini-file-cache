# Installs and builds with one current Node.js, then runs the tests on every Node.js the
# package supports. The library supports Node 16, but its build tools need not: rollup 4
# requires Node 18 and @rollup/plugin-terser 1 requires Node 20, so installing and building
# on every matrix version would run them on Node versions they do not support.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x, 22.x, 24.x, 26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24.x to install and build
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
    - run: npm ci
    # Fails on a known vulnerability in anything a consumer installs. Dev-only findings are
    # left to `npm audit`: they never reach a consumer, and some have no fixed release.
    - name: Audit runtime dependencies
      run: npm audit --omit=dev --audit-level=moderate
    - run: npm run build
    - name: Use Node.js ${{ matrix.node-version }} to test
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm test
